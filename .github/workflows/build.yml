name: Build app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build install file
        run: gradle assembleDebug --no-daemon --stacktrace
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk JayZee.apk
      - uses: actions/upload-artifact@v4
        with:
          name: JayZee
          path: JayZee.apk
      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          sleep 3
          gh release create latest JayZee.apk --title "Latest build" --notes "Built from ${GITHUB_SHA}. Download JayZee.apk on the phone and open it to install or update." --target "${GITHUB_SHA}"
